  Holo_Prepose:
    transitions:
      # 注意：transitions 是 {目标状态: 条件} 映射，同一目标只能绑一个按键。
      Passive: RB + A.on_pressed      # 终止：立即进入阻尼
      Holo_Box: RB + X.on_pressed     # 启动动作
    policy_dir: config/policy/holo_wbt/czy_box
    # exp_4 策略的参考是 166 段搬运片段中的 sub10_largebox_049（index 0，89 帧 1.78s）：
    # exp_4 策略的参考是 166 段搬运片段中的 sub12_largebox_046（index 53，230 帧 4.60s）：
    # 裁剪段起点即直立提箱、即将开始行走的姿态。
    duration_s: 4.60
    max_start_error: 1.0
    max_tilt: 1.0
    max_tilt_error: 0.7
    max_target_speed: 8.0
    # 只做预摆位并保持，等 RB+X 再进入 Holo_Box 跑动作。
    prepose_only: true
    prepose_s: 4.0
    # 摆位与保持期间抬高刚度（kd 按 sqrt 加），否则腰部 21 Nm 重力矩会把躯干压低 0.75 rad。
    # 进入 Holo_Box 时由该状态重新写入训练增益。
    prepose_kp_scale: 3.0
  Holo_Box:
    transitions:
      Passive: RB + A.on_pressed      # 终止：立即进入阻尼
      Velocity: RB + X.on_pressed     # 提前结束动作，交回站立
    policy_dir: config/policy/holo_wbt/czy_box
    # 与 Holo_Prepose 同一段参考：从片段首帧（直立提箱）走到片段尾。
    # 与 Holo_Prepose 同一段参考：从片段首帧（直立提箱）走到片段尾。
    duration_s: 4.60
    # 第 0 帧：直立提箱起步帧，姿态安静（倾角约 3°，骨盆 0.749 m）。
    max_start_error: 1.0
    # 绝对倾角只做粗判：搬运片段全程直立，真正的失控判据是 att_err。
    max_tilt: 1.45
    max_tilt_error: 0.7
    max_target_speed: 8.0
    # 预摆位已把姿态压到参考首帧 0.09 rad 内，不再需要冻结参考帧做过渡（冻结会让策略与参考失同步）。
    blend_s: 0.0
    blend_rate: 1.5
    prepose_only: false
    prepose_s: 0.0
  Velocity:
    transitions:
      Passive: LT + B.on_pressed
      Holo_Prepose: LT(2s) + right.on_pressed
    policy_dir: config/policy/velocity
