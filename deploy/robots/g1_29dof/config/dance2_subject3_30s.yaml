# BeyondMimic dance2_subject3_30s / G1 EDU U2 29DOF -- full clip (29.98 s).
# Trained with Tracking-Flat-G1-Dance-v0 (episode_length_s = 29.0, fit_episode_to_motion):
# one episode spans the whole 1499-frame clip instead of the 10 s default. The policy
# reaches the end of the clip, so the action plays the reference from frame 0 to the
# last frame.
#
# Verification (czy/analysis/g1_exp2_curves/):
#   - MuJoCo truth-state policy replay: 1499/1499 frames, min height 0.73 m, max tilt
#     27.4 deg, anchor error <= 0.25 m.
#   - MuJoCo truth-state FSM replay (Passive -> FixStand -> this state, harness released):
#     1499/1499 frames, min height 0.73 m, max tilt 26.8 deg, anchor error <= 0.25 m.
#   - MuJoCo FSM replay with the deployment's contact leg odometry is simulator-dependent:
#     the capsule soles of the training MJCF slide (their foot-floor <pair> friction is
#     0.8), while the leg odometry assumes a non-slipping support foot. Do not take its
#     frame count as a hardware prediction; truth-state runs prove the policy tracks the
#     whole clip.
# Keep the gantry attached and be ready on [L2 + B] for the first runs.
#
# Single-stage startup (no pre-pose state):
#   [L2 + UP]           FixStand: current pose -> the reference's frame-0 pose over 3 s
#                       (arms hang down, right hip roll -0.344), then held
#   [L2 2s + RIGHT]     BeyondMimic: entry check over all 29 joints (limit 0.6 rad), then
#                       the 1499-frame clip from frame 0 at 50 Hz with the training gains
#   [L2 + B]            abort to Passive damping at any point
#   segment end         Passive damping; the gantry must take the weight
